<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Área administrativa · Haptos 3D</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=haptos-1"><link rel="stylesheet" href="/style.css?v=portfolio-7"><link rel="stylesheet" href="/portfolio.css?v=portfolio-7"></head>
<body class="admin-page"><header><a class="brand" href="/"><img src="/assets/logo.png" alt="Haptos 3D" width="195" height="36"></a><a class="admin-back" href="/portfolio.html">Voltar ao portfólio ↗</a></header>
<main class="admin-main">
<section id="login-panel" class="login-panel"><p class="eyebrow">ÁREA ADMINISTRATIVA</p><h1>Seu trabalho<br>em destaque.</h1><p>Entre para gerenciar o portfólio da Haptos.</p><form id="login-form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Entrar <span>↗</span></button></form></section>
<section id="password-panel" class="login-panel" hidden><h1>Defina sua senha.</h1><form id="password-form"><label for="new-password">Nova senha (mínimo de 12 caracteres)</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm-password">Repita a senha</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required><button class="button">Salvar senha</button></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><p class="eyebrow">PORTFÓLIO HAPTOS</p><h1>Projetos realizados</h1></div><button id="logout" class="outline-button" type="button">Sair</button></div>
<div class="admin-columns"><section class="editor-panel"><h2 id="editor-title">Novo projeto</h2><form id="project-form"><input id="project-id" type="hidden"><label for="project-title">Título</label><input id="project-title" maxlength="100" required placeholder="Ex.: Suporte personalizado"><label for="project-description">Descrição</label><textarea id="project-description" maxlength="1800" required rows="5" placeholder="Conte o que foi produzido e para qual finalidade."></textarea><label for="project-photo">Foto do serviço</label><input id="project-photo" type="file" accept="image/jpeg,image/png,image/webp"><p class="field-help">JPG, PNG ou WebP, até 10 MB. A foto será otimizada sem cortar a peça.</p><img id="photo-preview" class="photo-preview" alt="Prévia da foto selecionada" hidden><label class="checkbox-label"><input id="project-published" type="checkbox" checked> Exibir no site</label><div class="editor-actions"><button class="button" id="save-project" type="submit">Publicar projeto</button><button class="outline-button" id="cancel-edit" type="button" hidden>Cancelar edição</button></div></form></section>
<section class="saved-projects"><h2>Seus trabalhos</h2><p id="admin-empty">Carregando projetos…</p><div id="admin-projects"></div></section></div></section>
<p id="admin-status" class="admin-status" role="status" aria-live="polite"></p>
</main><script src="/vendor/supabase-2.117.2.js"></script><script src="/portfolio-config.js?v=portfolio-7"></script><script src="/portfolio.js?v=portfolio-7"></script><script src="/admin.js?v=portfolio-7"></script></body></html>
